<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 400" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&amp;family=Kantumruy+Pro:wght@600;700&amp;family=Moul&amp;family=Playfair+Display:ital,wght@1,600&amp;display=swap');
      .road-line { stroke: #15325b; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .rail-tie { stroke: #15325b; stroke-width: 1.4; stroke-linecap: round; }
      .kh-text { font-family: 'Kantumruy Pro', 'Battambang', sans-serif; font-size: 8.5px; font-weight: 700; fill: #15325b; }
      .kh-title { font-family: 'Moul', 'Kantumruy Pro', serif; font-size: 9px; font-weight: 400; fill: #15325b; }
      .en-text { font-family: 'Cinzel', sans-serif; font-size: 8.5px; font-weight: 700; fill: #15325b; }
      .en-sub { font-family: 'Playfair Display', serif; font-style: italic; font-size: 7.2px; font-weight: 600; fill: #15325b; }
      .building-fill { fill: #15325b; }
      .window-cutout { fill: #ffffff; }
    </style>
  </defs>

  <!-- Road Network -->
  <g class="roads">
    <!-- Vertical Road: st. 598 & Blvd. 271 -->
    <path class="road-line" d="M 85 130 L 85 365" />
    <path class="road-line" d="M 99 130 L 99 365" />

    <!-- Top Diagonal Road: st. 315 -->
    <path class="road-line" d="M 99 158 L 255 82" />
    <path class="road-line" d="M 99 172 L 245 98" />

    <!-- Middle Horizontal Road: st. 608 -->
    <path class="road-line" d="M 99 165 L 260 165" />
    <path class="road-line" d="M 99 178 L 260 178" />

    <!-- Flyover Crossroad: ស្ពានអាកាស 7មករា -->
    <path class="road-line" d="M 45 295 L 290 220" />
    <path class="road-line" d="M 45 309 L 290 234" />

    <!-- Bottom Diagonal Road: មហាវិថីកម្ពុជាក្រោម (Blvd...) -->
    <path class="road-line" d="M 45 318 L 255 363" />
    <path class="road-line" d="M 45 332 L 250 376" />
  </g>

  <!-- Railway Tracks -->
  <g class="railway">
    <path d="M 215 244 L 288 221" stroke="#15325b" stroke-width="1.2" fill="none" />
    <path d="M 217 241 L 290 218" stroke="#15325b" stroke-width="1.2" fill="none" />
    <!-- Rail ties -->
    <line class="rail-tie" x1="219" y1="246" x2="221" y2="239" />
    <line class="rail-tie" x1="229" y1="243" x2="231" y2="236" />
    <line class="rail-tie" x1="239" y1="240" x2="241" y2="233" />
    <line class="rail-tie" x1="249" y1="237" x2="251" y2="230" />
    <line class="rail-tie" x1="259" y1="234" x2="261" y2="227" />
    <line class="rail-tie" x1="269" y1="231" x2="271" y2="224" />
    <line class="rail-tie" x1="279" y1="228" x2="281" y2="221" />
  </g>

  <!-- Navigation Chevron Arrow on st. 315 -->
  <g transform="translate(185, 118) rotate(-26)">
    <polygon points="0,0 20,7 0,14 4,7" fill="#ffffff" stroke="#15325b" stroke-width="1.6" />
  </g>

  <!-- Road Text Labels -->
  <g class="labels">
    <!-- st. 598 -->
    <text class="en-text" x="80" y="200" transform="rotate(-90 80 200)">st. 598</text>
    <!-- Blvd. 271 -->
    <text class="en-text" x="80" y="340" transform="rotate(-90 80 340)">Blvd. 271</text>
    <!-- st. 315 -->
    <text class="en-text" x="145" y="116" transform="rotate(-26 145 116)">st. 315</text>
    <!-- st. 608 -->
    <text class="en-text" x="140" y="160">st. 608</text>
    <!-- ស្ពានអាកាស 7មករា -->
    <text class="kh-text" x="85" y="290" transform="rotate(-17 85 290)">ស្ពានអាកាស 7មករា</text>
    <!-- ផ្លូវរថភ្លើង ស្ថានីយ -->
    <text class="kh-text" x="216" y="222" font-size="7.5px" transform="rotate(-17 216 222)">ផ្លូវរថភ្លើង ស្ថានីយ</text>
    <!-- មហាវិថីកម្ពុជាក្រោម -->
    <text class="kh-text" x="140" y="352" transform="rotate(12 140 352)">មហាវិថីកម្ពុជាក្រោម (Blvd...)</text>
  </g>

  <!-- Landmark 1: Antenna Tower -->
  <g class="antenna" transform="translate(252, 45)">
    <path class="road-line" d="M 8 36 L 14 6 L 20 36" stroke-width="1.6" />
    <line x1="9.5" y1="26" x2="18.5" y2="26" stroke="#15325b" stroke-width="1.3" />
    <line x1="11" y1="16" x2="17" y2="16" stroke="#15325b" stroke-width="1.3" />
    <line x1="9.5" y1="26" x2="17" y2="16" stroke="#15325b" stroke-width="1.2" />
    <line x1="18.5" y1="26" x2="11" y2="16" stroke="#15325b" stroke-width="1.2" />
    <line x1="14" y1="6" x2="14" y2="0" stroke="#15325b" stroke-width="1.6" />
    <!-- Radio Waves -->
    <path d="M 9 2 A 6 6 0 0 1 19 2" stroke="#15325b" stroke-width="1.2" fill="none" />
    <path d="M 6 -1 A 10 10 0 0 1 22 -1" stroke="#15325b" stroke-width="1" fill="none" />
    <path d="M 3 -4 A 14 14 0 0 1 25 -4" stroke="#15325b" stroke-width="0.8" fill="none" />
    <!-- Text -->
    <text class="kh-text" x="-5" y="8" text-anchor="end">អង់តែន</text>
    <text class="kh-text" x="-5" y="19" text-anchor="end">ទូរទស្សន៍បាយ័ន</text>
  </g>

  <!-- Landmark 2: Reception Venue (Seven Bright Restaurant) -->
  <g class="venue" transform="translate(196, 92) rotate(-26)">
    <!-- Building Silhouette -->
    <rect class="building-fill" x="0" y="0" width="46" height="22" rx="2" />
    <path class="building-fill" d="M -4 0 L 23 -13 L 50 0 Z" />
    <!-- Columns & Windows -->
    <rect class="window-cutout" x="6" y="8" width="6" height="14" rx="1" />
    <rect class="window-cutout" x="20" y="6" width="6" height="16" rx="1" />
    <rect class="window-cutout" x="34" y="8" width="6" height="14" rx="1" />
    <!-- Text -->
    <text class="kh-title" x="23" y="34" text-anchor="middle">ភោជនីយដ្ឋាន សេវេនប្រាយ</text>
    <text class="en-sub" x="23" y="45" text-anchor="middle">Seven Bright Restaurant</text>
  </g>

  <!-- Landmark 3: RUPP University -->
  <g class="rupp" transform="translate(156, 185)">
    <rect class="building-fill" x="0" y="8" width="36" height="18" rx="1.5" />
    <path class="building-fill" d="M 0 8 L 18 -2 L 36 8 Z" />
    <!-- Windows & Entrance -->
    <rect class="window-cutout" x="6" y="14" width="5" height="8" rx="1" />
    <rect class="window-cutout" x="15" y="12" width="6" height="14" rx="1" />
    <rect class="window-cutout" x="25" y="14" width="5" height="8" rx="1" />
    <!-- Flag -->
    <line x1="18" y1="-2" x2="18" y2="-9" stroke="#15325b" stroke-width="1.3" />
    <polygon points="18,-9 26,-6.5 18,-4" fill="#d4af37" stroke="#15325b" stroke-width="0.6" />
    <!-- Text -->
    <text class="kh-text" x="18" y="36" text-anchor="middle">សាកលវិទ្យាល័យភូមិន្ទភ្នំពេញ</text>
    <text class="en-text" x="18" y="47" font-size="8px" text-anchor="middle">(RUPP)</text>
  </g>

  <!-- Landmark 4: Contact Phone Numbers Box -->
  <g class="contact" transform="translate(120, 246)">
    <text class="kh-text" x="0" y="0">លេខទូរសព្ទទំនាក់ទំនង</text>
    <text class="en-text" x="0" y="13" font-size="8.8px">012 752 775</text>
    <text class="en-text" x="0" y="26" font-size="8.8px">012 246 494</text>
    <text class="en-text" x="0" y="39" font-size="8.8px">089 343 303</text>
  </g>
</svg>
